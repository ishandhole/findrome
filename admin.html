<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Findrome Admin | Event Registration Submissions</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem("theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute("data-theme", "dark");
            } else {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
</head>
<body>

    <!-- Translucent Stock Trend Background Elements -->
    <div class="stock-bg-overlay" aria-hidden="true">
        <!-- Stock Chart 1: Candlestick & Moving Average Trend -->
        <svg class="stock-chart-svg chart-top-right" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="chartGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="var(--green)" stop-opacity="0.25"/>
                    <stop offset="100%" stop-color="var(--green)" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <!-- Grid lines -->
            <line x1="50" y1="80" x2="750" y2="80" stroke="currentColor" stroke-dasharray="4 4" stroke-width="1" opacity="0.4"/>
            <line x1="50" y1="160" x2="750" y2="160" stroke="currentColor" stroke-dasharray="4 4" stroke-width="1" opacity="0.4"/>
            <line x1="50" y1="240" x2="750" y2="240" stroke="currentColor" stroke-dasharray="4 4" stroke-width="1" opacity="0.4"/>
            <line x1="50" y1="320" x2="750" y2="320" stroke="currentColor" stroke-dasharray="4 4" stroke-width="1" opacity="0.4"/>
            
            <line x1="150" y1="50" x2="150" y2="380" stroke="currentColor" stroke-dasharray="4 4" stroke-width="1" opacity="0.3"/>
            <line x1="300" y1="50" x2="300" y2="380" stroke="currentColor" stroke-dasharray="4 4" stroke-width="1" opacity="0.3"/>
            <line x1="450" y1="50" x2="450" y2="380" stroke="currentColor" stroke-dasharray="4 4" stroke-width="1" opacity="0.3"/>
            <line x1="600" y1="50" x2="600" y2="380" stroke="currentColor" stroke-dasharray="4 4" stroke-width="1" opacity="0.3"/>

            <!-- Candlesticks -->
            <!-- Candle 1 (Green) -->
            <line x1="90" y1="260" x2="90" y2="320" stroke="var(--green)" stroke-width="2"/>
            <rect x="83" y="275" width="14" height="30" fill="var(--green)" rx="1"/>
            
            <!-- Candle 2 (Red) -->
            <line x1="130" y1="270" x2="130" y2="330" stroke="#d93025" stroke-width="2"/>
            <rect x="123" y="280" width="14" height="35" fill="#d93025" rx="1"/>

            <!-- Candle 3 (Green) -->
            <line x1="170" y1="230" x2="170" y2="300" stroke="var(--green)" stroke-width="2"/>
            <rect x="163" y="245" width="14" height="40" fill="var(--green)" rx="1"/>

            <!-- Candle 4 (Green) -->
            <line x1="210" y1="210" x2="210" y2="280" stroke="var(--green)" stroke-width="2"/>
            <rect x="203" y="225" width="14" height="35" fill="var(--green)" rx="1"/>

            <!-- Candle 5 (Red) -->
            <line x1="250" y1="220" x2="250" y2="275" stroke="#d93025" stroke-width="2"/>
            <rect x="243" y="235" width="14" height="25" fill="#d93025" rx="1"/>

            <!-- Candle 6 (Green) -->
            <line x1="290" y1="180" x2="290" y2="250" stroke="var(--green)" stroke-width="2"/>
            <rect x="283" y="195" width="14" height="40" fill="var(--green)" rx="1"/>

            <!-- Candle 7 (Green) -->
            <line x1="330" y1="160" x2="330" y2="230" stroke="var(--green)" stroke-width="2"/>
            <rect x="323" y="175" width="14" height="40" fill="var(--green)" rx="1"/>

            <!-- Candle 8 (Red) -->
            <line x1="370" y1="170" x2="370" y2="225" stroke="#d93025" stroke-width="2"/>
            <rect x="363" y="180" width="14" height="30" fill="#d93025" rx="1"/>

            <!-- Candle 9 (Green) -->
            <line x1="410" y1="130" x2="410" y2="200" stroke="var(--green)" stroke-width="2"/>
            <rect x="403" y="145" width="14" height="40" fill="var(--green)" rx="1"/>

            <!-- Candle 10 (Green) -->
            <line x1="450" y1="110" x2="450" y2="180" stroke="var(--green)" stroke-width="2"/>
            <rect x="443" y="125" width="14" height="45" fill="var(--green)" rx="1"/>

            <!-- Candle 11 (Green) -->
            <line x1="490" y1="90" x2="490" y2="160" stroke="var(--green)" stroke-width="2"/>
            <rect x="483" y="105" width="14" height="40" fill="var(--green)" rx="1"/>

            <!-- Candle 12 (Red) -->
            <line x1="530" y1="100" x2="530" y2="155" stroke="#d93025" stroke-width="2"/>
            <rect x="523" y="115" width="14" height="28" fill="#d93025" rx="1"/>

            <!-- Candle 13 (Green) -->
            <line x1="570" y1="65" x2="570" y2="135" stroke="var(--green)" stroke-width="2"/>
            <rect x="563" y="80" width="14" height="42" fill="var(--green)" rx="1"/>

            <!-- Candle 14 (Green) -->
            <line x1="610" y1="50" x2="610" y2="115" stroke="var(--green)" stroke-width="2"/>
            <rect x="603" y="60" width="14" height="40" fill="var(--green)" rx="1"/>

            <!-- Candle 15 (Green) -->
            <line x1="650" y1="35" x2="650" y2="95" stroke="var(--green)" stroke-width="2"/>
            <rect x="643" y="45" width="14" height="38" fill="var(--green)" rx="1"/>

            <!-- Trend Area & Line -->
            <path d="M 90 290 Q 200 240, 300 205 T 450 135 T 570 90 T 650 55 L 650 380 L 90 380 Z" fill="url(#chartGrad1)"/>
            <path d="M 90 290 Q 200 240, 300 205 T 450 135 T 570 90 T 650 55" stroke="var(--green)" stroke-width="3" stroke-linecap="round" fill="none"/>
            <circle cx="650" cy="55" r="5" fill="var(--green)"/>

            <!-- Volume Bars at Bottom -->
            <rect x="85" y="350" width="10" height="30" fill="var(--green)" opacity="0.6"/>
            <rect x="125" y="340" width="10" height="40" fill="#d93025" opacity="0.5"/>
            <rect x="165" y="330" width="10" height="50" fill="var(--green)" opacity="0.7"/>
            <rect x="205" y="345" width="10" height="35" fill="var(--green)" opacity="0.6"/>
            <rect x="245" y="355" width="10" height="25" fill="#d93025" opacity="0.5"/>
            <rect x="285" y="325" width="10" height="55" fill="var(--green)" opacity="0.8"/>
            <rect x="325" y="320" width="10" height="60" fill="var(--green)" opacity="0.8"/>
            <rect x="365" y="350" width="10" height="30" fill="#d93025" opacity="0.5"/>
            <rect x="405" y="310" width="10" height="70" fill="var(--green)" opacity="0.85"/>
            <rect x="445" y="300" width="10" height="80" fill="var(--green)" opacity="0.9"/>
            <rect x="485" y="315" width="10" height="65" fill="var(--green)" opacity="0.8"/>
            <rect x="525" y="345" width="10" height="35" fill="#d93025" opacity="0.5"/>
            <rect x="565" y="295" width="10" height="85" fill="var(--green)" opacity="0.95"/>
            <rect x="605" y="290" width="10" height="90" fill="var(--green)" opacity="0.95"/>
            <rect x="645" y="280" width="10" height="100" fill="var(--green)" opacity="1"/>
        </svg>

        <!-- Stock Chart 2: Smooth Trend Curve with Trading Metrics (Bottom-Left) -->
        <svg class="stock-chart-svg chart-bottom-left" viewBox="0 0 700 350" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="chartGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="var(--green)" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="var(--green)" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <!-- Horizontal Price Grid -->
            <line x1="40" y1="60" x2="660" y2="60" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1" opacity="0.35"/>
            <line x1="40" y1="130" x2="660" y2="130" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1" opacity="0.35"/>
            <line x1="40" y1="200" x2="660" y2="200" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1" opacity="0.35"/>
            <line x1="40" y1="270" x2="660" y2="270" stroke="currentColor" stroke-dasharray="3 3" stroke-width="1" opacity="0.35"/>
            
            <!-- Upward Trend Line & Gradient Area -->
            <path d="M 40 250 C 120 270, 180 210, 250 190 C 320 170, 370 200, 440 140 C 510 80, 580 95, 660 40 L 660 310 L 40 310 Z" fill="url(#chartGrad2)"/>
            <path d="M 40 250 C 120 270, 180 210, 250 190 C 320 170, 370 200, 440 140 C 510 80, 580 95, 660 40" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            
            <!-- Secondary Moving Average (dashed) -->
            <path d="M 40 260 C 140 250, 250 215, 360 175 C 470 135, 570 90, 660 65" stroke="currentColor" stroke-dasharray="5 5" stroke-width="1.5" opacity="0.45" fill="none"/>
            
            <circle cx="660" cy="40" r="4" fill="var(--green)"/>
        </svg>

        <!-- Stock Chart 3: Subtle Center-Watermark Candlestick Cluster -->
        <svg class="stock-chart-svg chart-center-pattern" viewBox="0 0 500 250" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="50" y1="180" x2="50" y2="230" stroke="var(--green)" stroke-width="1.5"/>
            <rect x="44" y="190" width="12" height="30" fill="var(--green)" rx="1"/>
            <line x1="90" y1="160" x2="90" y2="210" stroke="var(--green)" stroke-width="1.5"/>
            <rect x="84" y="170" width="12" height="30" fill="var(--green)" rx="1"/>
            <line x1="130" y1="170" x2="130" y2="220" stroke="#d93025" stroke-width="1.5"/>
            <rect x="124" y="180" width="12" height="25" fill="#d93025" rx="1"/>
            <line x1="170" y1="130" x2="170" y2="185" stroke="var(--green)" stroke-width="1.5"/>
            <rect x="164" y="140" width="12" height="35" fill="var(--green)" rx="1"/>
            <line x1="210" y1="110" x2="210" y2="165" stroke="var(--green)" stroke-width="1.5"/>
            <rect x="204" y="120" width="12" height="35" fill="var(--green)" rx="1"/>
            <line x1="250" y1="90" x2="250" y2="145" stroke="var(--green)" stroke-width="1.5"/>
            <rect x="244" y="100" width="12" height="35" fill="var(--green)" rx="1"/>
            <line x1="290" y1="100" x2="290" y2="150" stroke="#d93025" stroke-width="1.5"/>
            <rect x="284" y="110" width="12" height="28" fill="#d93025" rx="1"/>
            <line x1="330" y1="60" x2="330" y2="120" stroke="var(--green)" stroke-width="1.5"/>
            <rect x="324" y="70" width="12" height="40" fill="var(--green)" rx="1"/>
            <line x1="370" y1="40" x2="370" y2="95" stroke="var(--green)" stroke-width="1.5"/>
            <rect x="364" y="50" width="12" height="35" fill="var(--green)" rx="1"/>
            <line x1="410" y1="20" x2="410" y2="75" stroke="var(--green)" stroke-width="1.5"/>
            <rect x="404" y="30" width="12" height="35" fill="var(--green)" rx="1"/>
            
            <path d="M 50 200 Q 150 160, 250 115 T 410 40" stroke="var(--green)" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
    </div>

    <!-- Admin Header -->
    <header class="admin-header">
        <div class="header-container admin-header-container">
            <div class="logo-wrapper">
                <img src="assets/logo.png" alt="Findrome Logo" class="logo logo-light">
                <img src="assets/1.png" alt="Findrome Logo" class="logo logo-dark">
                <span class="admin-badge">Admin Portal</span>
            </div>

            <div class="admin-header-actions">
                <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle Dark/Light Mode">
                    <span class="theme-toggle-icon">
                        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </span>
                    <span class="theme-toggle-label"></span>
                </button>
                <button type="button" id="logoutBtn" class="admin-btn-secondary hidden">Log Out</button>
            </div>
        </div>
    </header>

    <main class="admin-main">

        <!-- Login Card Section (Shown if unauthenticated) -->
        <section id="loginSection" class="admin-login-wrapper">
            <div class="admin-card login-card">
                <div class="login-header">
                    <span class="lock-icon">🔒</span>
                    <h2>Admin Access</h2>
                    <p>Enter the administrator password to access event registration submissions and Excel export.</p>
                </div>
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="adminPassword">Admin Password</label>
                        <input
                            type="password"
                            id="adminPassword"
                            name="adminPassword"
                            placeholder="Enter admin password"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                    <div id="loginError" class="field-error login-error hidden"></div>
                    <button type="submit" class="admin-btn-primary full-width-btn" id="loginSubmitBtn">
                        Sign In to Portal
                    </button>
                </form>
            </div>
        </section>

        <!-- Dashboard Section (Shown if authenticated) -->
        <section id="dashboardSection" class="admin-dashboard hidden">

            <!-- Stats Metrics -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <span class="metric-label">Total Registrations</span>
                    <span class="metric-val" id="statTotal">0</span>
                    <span class="metric-desc">Registered participants</span>
                </div>
            </div>

            <!-- Toolbar & Controls -->
            <div class="admin-toolbar">
                <div class="toolbar-search">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search by name, SAP ID, email, or branch...">
                </div>

                <div class="toolbar-filters">
                    <select id="filterProgram">
                        <option value="">All Programs</option>
                        <option value="MBATECH">MBA Tech</option>
                        <option value="BTECH">B.Tech</option>
                        <option value="BTI">BTI</option>
                    </select>

                    <button type="button" id="downloadExcelBtn" class="admin-btn-green">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download Excel (.xlsx)
                    </button>
                </div>
            </div>

            <!-- Submissions Table -->
            <div class="table-container">
                <table class="submissions-table" id="submissionsTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Date</th>
                            <th>Candidate</th>
                            <th>Contact</th>
                            <th>SAP ID</th>
                            <th>Degree & Year</th>
                            <th>Branch</th>
                        </tr>
                    </thead>
                    <tbody id="submissionsTableBody">
                        <tr>
                            <td colspan="7" class="table-loading">Loading registrations...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Bottom Table Actions / Footer -->
            <div class="admin-table-footer">
                <div class="footer-info">
                    <span>Showing <strong id="visibleCount">0</strong> registrations</span>
                </div>
                <button type="button" id="clearAllBtn" class="admin-btn-danger" title="Clear all test entries and reset Excel file">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                    Clear All Test Entries
                </button>
            </div>

        </section>

    </main>

    <script src="admin.js"></script>
</body>
</html>
